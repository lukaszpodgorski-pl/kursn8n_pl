name: Sprawdzanie linków

on:
  pull_request:
    paths: ['**/*.md', '**/*.mdx']
  schedule:
    # raz w tygodniu, poniedziałek 06:00 UTC - łapie linki, które umarły z czasem
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Instalacja (zgodna z lockfile)
        run: npm ci
      - name: Build produkcyjny
        run: npm run build
      - name: lychee - weryfikacja linków
        uses: lycheeverse/lychee-action@v2
        with:
          # Sprawdzamy ZBUDOWANY serwis, nie źródła w Markdownie. Powód: linki
          # wewnętrzne są root-relative (`/modul-3-praca-z-danymi`), a w źródłach nie
          # da się ich rozwiązać - struktura treści jest płaska (`modul-3-praca-z-danymi.mdx`
          # leży bezpośrednio w `src/content/docs/`), więc nie ma pliku ani katalogu
          # o ścieżce odpowiadającej temu URL-owi. lychee zgłaszał wtedy
          # "Cannot resolve root-relative link" dla każdego z nich, a `--exclude`
          # tego nie tłumi, bo błąd powstaje na etapie rozwiązywania URI, zanim
          # filtr ma co odrzucać. W `dist/` te adresy są prawdziwymi katalogami
          # z `index.html` (mimo `trailingSlash: 'never'` w adresach źródłowych),
          # więc rozwiązują się poprawnie razem z zewnętrznymi.
          # Kod 999 to celowa blokada LinkedIn wobec botów - link jest sprawny.
          # --max-retries/--retry-wait-time: GitHub i inne duże serwisy potrafią na
          # kilkadziesiąt sekund odpowiadać 502/504. Domyślne 3 ponowienia co 1 s tego
          # nie przeczekają - 2026-11-09 o 06:03 UTC trzy PR-y padły na 504 z github.com,
          # a ponowione bez żadnej zmiany przeszły. Odstęp rośnie wykładniczo od 5 s.
          #
          # --remap, czyli sprawdzamy to samo, ale tam, gdzie odpowiedź jest wiarygodna:
          # 1-2. github.com dla anonimowego ruchu potrafi godzinami zwracać 504 w 0,15 s
          #      (incydent GitHuba "surge in anonymous users", 2026-11-08 i 2026-11-09),
          #      niezależnie od User-Agenta. Ponawianie tu nie pomaga. Widok pliku
          #      `blob/` sprawdzamy na raw.githubusercontent.com (200 gdy plik jest,
          #      404 gdy zniknął - kontrola zostaje), a stronę `/releases` na stronie
          #      głównej repo (releases istnieje dla każdego repo, które istnieje).
          # 3-4. Własne adresy bezwzględne (canonical, og:url, JSON-LD) sprawdzamy
          #      w zbudowanym `dist/`, nie na produkcji. Inaczej każda nowa strona
          #      dostaje 404, dopóki nie zostanie wdrożona, a wdrożenie wymaga merge'a.
          #      Przy okazji wyłapuje to canonical wskazujący na stronę, której build
          #      nie wygenerował. Strona błędu to plik `404.html`, nie katalog -
          #      stąd osobna reguła przed ogólną.
          args: >-
            --no-progress
            --max-retries 4
            --retry-wait-time 5
            --accept 200,206,403,429,999
            --remap '^https://github\.com/([^/]+)/([^/]+)/blob/(.+)$ https://raw.githubusercontent.com/$1/$2/$3'
            --remap '^https://github\.com/([^/]+)/([^/]+)/releases/?$ https://github.com/$1/$2'
            --remap '^https://kursn8n\.pl/404$ file://${{ github.workspace }}/dist/404.html'
            --remap '^https://kursn8n\.pl/(.*)$ file://${{ github.workspace }}/dist/$1'
            --root-dir "${{ github.workspace }}/dist"
            'dist/**/*.html'
          fail: true
